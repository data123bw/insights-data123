name: Deploy Insights Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Fail closed if the MotherDuck build secret is not configured: both the
      # `insights` and `bse` sources are `type: motherduck` and the build cannot
      # authenticate without it. This step never prints the value.
      - name: Require MotherDuck build secret
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          if [ -z "${MOTHERDUCK_TOKEN}" ]; then
            echo "::error::secrets.MOTHERDUCK_TOKEN is not set; the motherduck-backed sources (insights, bse) cannot build."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "build"
          app_build_command: "npm run sources && npm run build && npm run compress-wasm"
        env:
          # Both motherduck-backed sources authenticate to the same MotherDuck
          # database (`insights`) with the same protected secret. The per-source
          # env-override name is what the @evidence-dev/motherduck connector reads
          # (it does NOT read MOTHERDUCK_TOKEN). sources/insights/ is unchanged.
          EVIDENCE_SOURCE__insights__token: ${{ secrets.MOTHERDUCK_TOKEN }}
          EVIDENCE_SOURCE__bse__token: ${{ secrets.MOTHERDUCK_TOKEN }}
